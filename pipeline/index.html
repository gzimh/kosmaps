<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="https://cesium.com/downloads/cesiumjs/releases/1.123/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.123/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>html,body,#c{margin:0;width:100%;height:100%;overflow:hidden;background:#f3ecde}</style>
</head>
<body>
<div id="c"></div>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const LAT = +q.get('lat'), LON = +q.get('lon');
  const WIDTH_M = +(q.get('w') || 430);       // orthographic frustum width in metres
  const HEADING = +(q.get('heading') || 45);   // camera looks toward NE, same as the OSM render
  const PITCH = +(q.get('pitch') || -45);
  window.status_ = 'starting';
  try {
    Cesium.GoogleMaps.defaultApiKey = q.get('key');
    const viewer = new Cesium.Viewer('c', {
      globe: false, baseLayerPicker: false, geocoder: false, timeline: false, animation: false,
      homeButton: false, sceneModePicker: false, navigationHelpButton: false, fullscreenButton: false,
      infoBox: false, selectionIndicator: false, skyBox: false, skyAtmosphere: false,
      contextOptions: { webgl: { preserveDrawingBuffer: true } },
    });
    viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#f3ecde');
    viewer.scene.fog.enabled = false;
    // fixed noon-ish sun so lighting is reproducible
    viewer.clock.currentTime = Cesium.JulianDate.fromIso8601('2026-06-21T10:00:00Z');
    viewer.clock.shouldAnimate = false;

    const tileset = await Cesium.createGooglePhotorealistic3DTileset();
    tileset.maximumScreenSpaceError = 4;   // load finer LODs than default (16)
    viewer.scene.primitives.add(tileset);

    const fr = new Cesium.OrthographicFrustum();
    fr.width = WIDTH_M;
    fr.aspectRatio = viewer.canvas.clientWidth / viewer.canvas.clientHeight;
    viewer.camera.frustum = fr;

    const aim = (h) => {
      const target = Cesium.Cartesian3.fromDegrees(LON, LAT, h);
      viewer.camera.lookAt(target, new Cesium.HeadingPitchRange(
        Cesium.Math.toRadians(HEADING), Cesium.Math.toRadians(PITCH), 1500));
      viewer.camera.frustum.width = WIDTH_M;   // lookAt resets ortho width to the range; force it back
    };
    const loaded = () => new Promise((res) => {
      const t0 = Date.now();
      const tick = () => {
        if (tileset.tilesLoaded && Date.now() - t0 > 1500) return res();
        if (Date.now() - t0 > 120000) return res();
        setTimeout(tick, 300);
      };
      tick();
    });

    aim(650);                       // Prishtinë is ~600 m a.s.l.; refine below
    window.status_ = 'loading-coarse';
    await loaded();
    const [c] = await viewer.scene.sampleHeightMostDetailed([Cesium.Cartographic.fromDegrees(LON, LAT)]);
    const groundH = (c && Number.isFinite(c.height)) ? c.height : 650;
    window.groundH = groundH;
    aim(groundH);
    window.status_ = 'loading-fine';
    await loaded();
    await new Promise(r => setTimeout(r, 1500));
    window.status_ = 'ready';
  } catch (e) {
    window.status_ = 'error: ' + (e && e.message || e);
  }
})();
</script>
</body>
</html>
