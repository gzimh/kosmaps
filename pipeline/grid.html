<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="https://cesium.com/downloads/cesiumjs/releases/1.123/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.123/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
  html,body,#c{margin:0;width:100%;height:100%;overflow:hidden;background:#f3ecde}
  .cesium-viewer-bottom{display:none!important}  /* credits shown in the map viewer UI instead */
</style>
</head>
<body>
<div id="c"></div>
<script>
// One orthographic camera; tiles are produced by sliding it along its own right/up axes.
// Because the projection is orthographic, adjacent tiles line up exactly in screen space.
window.setup = async ({ key, lat, lon, widthM, heading, pitch, mode }) => {
  Cesium.GoogleMaps.defaultApiKey = key;
  const dataPass = mode === 'up' || mode === 'hbits';
  const viewer = new Cesium.Viewer('c', {
    msaaSamples: dataPass ? 1 : 4,
    globe: false, baseLayerPicker: false, geocoder: false, timeline: false, animation: false,
    homeButton: false, sceneModePicker: false, navigationHelpButton: false, fullscreenButton: false,
    infoBox: false, selectionIndicator: false, skyBox: false, skyAtmosphere: false,
    contextOptions: { webgl: { preserveDrawingBuffer: true } },
  });
  viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#f3ecde');
  viewer.scene.fog.enabled = false;
  const tileset = await Cesium.createGooglePhotorealistic3DTileset();
  tileset.maximumScreenSpaceError = 4;
  viewer.scene.primitives.add(tileset);
  if (dataPass) viewer.scene.postProcessStages.fxaa.enabled = false;
  if (mode === 'hbits') {
    // Height pass: surface height relative to the target ground point, quantised to 1/16 m over
    // [-64, +192) m (12 bits), emitted 3 bits at a time as pure 0/1 channels so no colour transform
    // can corrupt it. Computed in eye space for float precision.
    viewer.scene.backgroundColor = Cesium.Color.BLACK;
    const cs = new Cesium.CustomShader({
      lightingModel: Cesium.LightingModel.UNLIT,
      uniforms: {
        u_targetEC: { type: Cesium.UniformType.VEC3, value: new Cesium.Cartesian3() },
        u_upEC: { type: Cesium.UniformType.VEC3, value: new Cesium.Cartesian3(0, 0, 1) },
        u_bit: { type: Cesium.UniformType.FLOAT, value: 0 },
      },
      fragmentShaderText: `
        void fragmentMain(FragmentInput fsInput, inout czm_modelMaterial material) {
          float hr = dot(fsInput.attributes.positionEC - u_targetEC, u_upEC);
          float q = floor(clamp((hr + 64.0) / 0.0625, 1.0, 4095.0));
          float s = floor(q / pow(8.0, u_bit) + 1e-3);
          material.diffuse = vec3(mod(s, 2.0), mod(floor(s / 2.0), 2.0), mod(floor(s / 4.0), 2.0));
        }`,
    });
    tileset.customShader = cs;
    window.setBit = (b) => cs.setUniform('u_bit', b);
    viewer.scene.preRender.addEventListener(() => {
      const T = Cesium.Cartesian3.fromDegrees(lon, lat, window.groundH ?? 620);
      const U = Cesium.Ellipsoid.WGS84.geodeticSurfaceNormal(T, new Cesium.Cartesian3());
      const V = viewer.camera.viewMatrix;
      cs.setUniform('u_targetEC', Cesium.Matrix4.multiplyByPoint(V, T, new Cesium.Cartesian3()));
      cs.setUniform('u_upEC', Cesium.Cartesian3.normalize(Cesium.Matrix4.multiplyByPointAsVector(V, U, new Cesium.Cartesian3()), new Cesium.Cartesian3()));
    });
  }
  if (mode === 'up') {
    // Auxiliary pass: how much each surface faces the sky (1 = flat roof/ground, 0 = wall).
    // Photogrammetry meshes may lack normals, so derive them from screen-space derivatives.
    viewer.scene.backgroundColor = Cesium.Color.BLACK;
    tileset.customShader = new Cesium.CustomShader({
      lightingModel: Cesium.LightingModel.UNLIT,
      fragmentShaderText: `
        void fragmentMain(FragmentInput fsInput, inout czm_modelMaterial material) {
          vec3 p = fsInput.attributes.positionEC;
          vec3 nEC = normalize(cross(dFdx(p), dFdy(p)));
          vec3 nWC = normalize(czm_inverseViewRotation * nEC);
          vec3 upWC = normalize(fsInput.attributes.positionWC);
          float u = abs(dot(nWC, upWC));
          material.diffuse = vec3(u);
        }`,
    });
  }

  const fr = new Cesium.OrthographicFrustum();
  fr.width = widthM;
  fr.aspectRatio = 1;
  viewer.camera.frustum = fr;
  // Cesium re-derives ortho width from camera distance in 3D mode; pin it every frame.
  viewer.scene.preRender.addEventListener(() => { viewer.camera.frustum.width = widthM; });
  viewer.scene.screenSpaceCameraController.enableInputs = false;

  const loaded = () => new Promise((res) => {
    const t0 = Date.now();
    const tick = () => {
      if (tileset.tilesLoaded && Date.now() - t0 > 1500) return res(true);
      if (Date.now() - t0 > 120000) return res(false);
      setTimeout(tick, 300);
    };
    tick();
  });

  const aim = (h) => {
    viewer.camera.lookAt(Cesium.Cartesian3.fromDegrees(lon, lat, h),
      new Cesium.HeadingPitchRange(Cesium.Math.toRadians(heading), Cesium.Math.toRadians(pitch), 1500));
    viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);  // release so we can translate freely
    viewer.camera.frustum.width = widthM;
  };
  aim(650);
  await loaded();
  const [c] = await viewer.scene.sampleHeightMostDetailed([Cesium.Cartographic.fromDegrees(lon, lat)]);
  const groundH = (c && Number.isFinite(c.height)) ? c.height : 650;
  window.groundH = groundH;
  aim(groundH);
  const home = {
    position: viewer.camera.position.clone(),
    direction: viewer.camera.direction.clone(),
    up: viewer.camera.up.clone(),
    right: viewer.camera.right.clone(),
  };

  window.shoot = async (dxM, dyM) => {
    viewer.camera.setView({ destination: home.position, orientation: { direction: home.direction, up: home.up } });
    viewer.camera.frustum.width = widthM;
    viewer.camera.moveRight(dxM);
    viewer.camera.moveUp(dyM);
    const ok = await loaded();
    await new Promise(r => setTimeout(r, 800));
    return ok;
  };
  window.credits = () => {
    const el = document.querySelector('.cesium-credit-lightbox, .cesium-widget-credits');
    return el ? el.innerText : '';
  };
  return groundH;
};
</script>
</body>
</html>
