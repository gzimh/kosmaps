<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Small Prishtinë — prototype</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#efe7d6;font:14px/1.3 -apple-system,system-ui,sans-serif;color:#3d342c}
  #stage{position:absolute;inset:0;cursor:grab}
  #stage.drag{cursor:grabbing}
  #stage img{position:absolute;top:0;left:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;image-rendering:auto}
  #bar{position:absolute;top:14px;left:14px;display:flex;gap:8px;align-items:center;background:#fffaf0e6;padding:8px 12px;border-radius:10px;box-shadow:0 2px 10px #0002}
  #bar b{font-size:15px;margin-right:6px}
  button{border:1px solid #c9bba4;background:#fff;border-radius:7px;padding:5px 10px;cursor:pointer;font:inherit}
  button.on{background:#3d342c;color:#fff;border-color:#3d342c}
  #credit{position:absolute;bottom:8px;left:10px;font-size:11px;color:#5d5246;background:#fffaf0cc;padding:3px 7px;border-radius:5px}
</style>
</head>
<body>
<div id="stage">
  <img id="raw" src="mosaic_raw.png" alt="">
  <img id="art" src="mosaic_styled.png" alt="">
</div>
<div id="bar">
  <b>Small Prishtinë</b>
  <button id="bArt" class="on">Illustration</button>
  <button id="bRaw">Photo 3D</button>
  <button id="bNaive">Naive seams</button>
</div>
<div id="credit">Base: Google Photorealistic 3D Tiles — Data: Google, Landsat / Copernicus, Airbus · Rendered with CesiumJS · Private prototype</div>
<script>
const stage = document.getElementById('stage'), art = document.getElementById('art'), raw = document.getElementById('raw');
let s = 0.35, x = 0, y = 0, drag = null;
const apply = () => { for (const im of [art, raw]) im.style.transform = `translate(${x}px,${y}px) scale(${s})`; };
const fit = () => {
  const w = art.naturalWidth || 3072;
  s = Math.min(innerWidth, innerHeight) / w * 0.95;
  x = (innerWidth - w * s) / 2; y = (innerHeight - w * s) / 2; apply();
};
art.onload = fit; if (art.complete) fit();
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const k = Math.exp(-e.deltaY * 0.0015), ns = Math.min(4, Math.max(0.1, s * k));
  x = e.clientX - (e.clientX - x) * ns / s; y = e.clientY - (e.clientY - y) * ns / s; s = ns; apply();
}, { passive: false });
stage.addEventListener('pointerdown', e => { drag = [e.clientX - x, e.clientY - y]; stage.classList.add('drag'); stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove', e => { if (drag) { x = e.clientX - drag[0]; y = e.clientY - drag[1]; apply(); } });
stage.addEventListener('pointerup', () => { drag = null; stage.classList.remove('drag'); });
const set = (mode) => {
  raw.style.display = mode === 'raw' ? '' : 'none';
  art.style.display = mode === 'raw' ? 'none' : '';
  art.src = mode === 'naive' ? 'mosaic_styled_naive.png' : 'mosaic_styled.png';
  for (const [id, m] of [['bArt', 'art'], ['bRaw', 'raw'], ['bNaive', 'naive']]) document.getElementById(id).classList.toggle('on', m === mode);
};
bArt.onclick = () => set('art'); bRaw.onclick = () => set('raw'); bNaive.onclick = () => set('naive');
set('art');
</script>
</body>
</html>
