<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Small Prishtinë — live prototype</title>
<style>
  :root{--ink:#3a3129;--paper:#fffaf0;--line:#d9ccb6}
  html,body{margin:0;height:100%;overflow:hidden;background:#1b1a22;font:13px/1.35 -apple-system,system-ui,sans-serif;color:var(--ink)}
  canvas{position:fixed;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
  canvas.drag{cursor:grabbing}
  #panel{position:fixed;top:14px;left:14px;width:270px;background:#fffaf0ee;border-radius:12px;box-shadow:0 4px 18px #0004;padding:12px 14px;backdrop-filter:blur(6px)}
  #panel h1{font:600 16px Georgia,serif;margin:0 0 2px}
  #status{color:#6b5e50;font-size:12px;margin-bottom:10px;min-height:32px}
  .row{display:grid;grid-template-columns:72px 1fr 44px;align-items:center;gap:6px;margin:5px 0}
  .row label{color:#5a4e42}
  .row span{text-align:right;font-variant-numeric:tabular-nums;color:#5a4e42}
  input[type=range]{width:100%;accent-color:#7a5a3a}
  .btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 9px;cursor:pointer;font:inherit;color:var(--ink)}
  button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  #hide{position:absolute;top:8px;right:10px;border:none;background:none;font-size:16px;padding:2px 4px;color:#8a7b6a}
  #credit{position:fixed;bottom:8px;left:10px;font-size:11px;color:#efe6d6;background:#0006;padding:3px 8px;border-radius:5px}
  #help{position:fixed;bottom:8px;right:10px;font-size:11px;color:#efe6d6;background:#0006;padding:3px 8px;border-radius:5px}
  #show{position:fixed;top:14px;left:14px;display:none}
  #ov{pointer-events:none}
  #card{position:fixed;top:14px;right:14px;width:290px;background:#2b2724f2;color:#f3ece0;border-radius:12px;box-shadow:0 6px 22px #0006;padding:14px 16px 12px;display:none;font:14px/1.4 Georgia,serif}
  #card .k{font:600 10.5px -apple-system,system-ui,sans-serif;letter-spacing:.12em;color:#e07a5f;margin-bottom:4px}
  #card h2{font:400 23px Georgia,serif;margin:0 0 6px}
  #card p{margin:3px 0}
  #card .muted{color:#b9ad9c}
  #card .src{font:11px/1.4 -apple-system,system-ui,sans-serif;color:#a99d8c;margin-top:10px}
  #card .src a{color:#d6c7b2}
  #card button{position:absolute;top:8px;right:10px;border:none;background:none;color:#b9ad9c;font-size:16px;padding:2px 4px}
  #card ul{margin:4px 0 0;padding-left:18px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="ov"></canvas>
<div id="card"><button id="cardx" title="close">✕</button><div class="k">SELECTED</div><div id="cardbody"></div></div>
<button id="show">☰ Controls</button>
<div id="panel">
  <button id="hide" title="hide">✕</button>
  <h1>Small Prishtinë</h1>
  <div id="status">Loading…</div>
  <div class="row"><label>Time</label><input id="t" type="range" min="0" max="1439" step="1"><span id="tv"></span></div>
  <div class="row"><label>Clouds</label><input id="cl" type="range" min="0" max="100"><span id="clv"></span></div>
  <div class="row"><label>Rain</label><input id="rn" type="range" min="0" max="100"><span id="rnv"></span></div>
  <div class="row"><label>Snow</label><input id="sn" type="range" min="0" max="100"><span id="snv"></span></div>
  <div class="row"><label>PM2.5</label><input id="pm" type="range" min="0" max="250"><span id="pmv"></span></div>
  <div class="btns">
    <button id="live" class="on">● Live</button>
    <button id="play">▶ Play a day</button>
    <button id="home">Reset view</button>
  </div>
</div>
<div id="credit">Base: Google Photorealistic 3D Tiles (Google, Landsat / Copernicus, Airbus) · Weather & air: Open-Meteo · Private prototype</div>
<div id="help">click a building · drag to pan · scroll / pinch to zoom · double-click to zoom in</div>

<script>
const LAT = __LAT__, LON = __LON__;
const SRC = { day: "__DAY__", night: "__NIGHT__", up: "__UP__", id: "__IDMAP__" };
const BLD = __BUILDINGS__;

// ---------------------------------------------------------------- WebGL setup
const cv = document.getElementById('c');
const ov = document.getElementById('ov'), octx = ov.getContext('2d');
const gl = cv.getContext('webgl2', { antialias: false, premultipliedAlpha: false });
if (!gl) document.getElementById('status').textContent = 'WebGL2 not available in this browser.';

const VS = `#version 300 es
in vec2 p; out vec2 v; void main(){ v = p; gl_Position = vec4(p,0.,1.); }`;

const FS = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform sampler2D uDay, uNight, uUp, uId;
uniform float uSel, uHov;
uniform vec2 uRes;       // canvas px
uniform vec2 uOff;       // image px at canvas origin
uniform float uScale;    // canvas px per image px
uniform float uImg;      // image size px
uniform float uNightK, uGoldK, uCloud, uRain, uSnow, uSmog, uTime;
uniform vec2 uWind;

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
}
float fbm(vec2 p){ float a=.5, s=0.; for(int k=0;k<4;k++){ s+=a*vnoise(p); p*=2.03; a*=.5; } return s; }
float bid(vec2 ip){
  ivec2 t = ivec2(clamp(floor(ip), vec2(0.), vec2(uImg - 1.)));
  vec3 c = texelFetch(uId, t, 0).rgb;
  return floor(c.r * 255. + .5) + floor(c.g * 255. + .5) * 256.;
}
float luma(vec3 c){ return dot(c, vec3(.299,.587,.114)); }
vec3 sat(vec3 c, float k){ float l = luma(c); return mix(vec3(l), c, k); }

void main(){
  vec2 frag = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 ip = uOff + frag / uScale;                // image pixel
  vec2 uv = ip / uImg;
  if (uv.x < 0. || uv.y < 0. || uv.x > 1. || uv.y > 1.) {
    vec3 bg = mix(vec3(.94,.91,.85), vec3(.10,.10,.14), uNightK);
    o = vec4(bg, 1.); return;
  }
  vec3 day = texture(uDay, uv).rgb;
  vec3 night = texture(uNight, uv).rgb;
  float up = texture(uUp, uv).r;
  float far = 1. - uv.y;                         // top of image is farther from the camera

  // 1. sun: golden-hour grade on the day layer, then blend toward the baked night layer
  vec3 gold = clamp((day - .5) * 1.08 + .5, 0., 1.) * vec3(1.10,.93,.74) + .05 * vec3(1.,.6,.2) * far;
  vec3 dayLit = mix(day, gold, uGoldK);
  vec3 col = mix(dayLit, night * mix(vec3(1.), vec3(1.05,.95,1.), uGoldK), uNightK);

  // 2. clouds: flatten + desaturate + cool, with drifting cloud shadows (daytime only)
  vec2 wp = ip / 520. + uWind * uTime * .004;
  float cs = fbm(wp);
  vec3 over = ((sat(col, .55) - .5) * .82 + .5) * vec3(.92,.95,1.) * .93;
  col = mix(col, over, uCloud * .85);
  col *= 1. - uCloud * (1. - uNightK) * .16 * smoothstep(.35, .75, cs);

  // 3. rain: darker and cooler, wet sheen on sky-facing surfaces, animated streaks
  vec3 wet = ((sat(col, .5) - .5) * .8 + .5) * vec3(.82,.86,.94) * .82;
  col = mix(col, wet, uRain);
  float sheen = step(.85, up) * vnoise(ip / 6.) * .10;
  col += uRain * sheen * mix(vec3(1.), vec3(1.,.8,.5), uNightK);
  vec2 rp = frag * vec2(1., .12) + vec2(frag.y * .23, uTime * 260.);
  vec2 cell = floor(rp / vec2(3., 6.));
  float drop = step(.985 - uRain * .02, hash(cell)) * smoothstep(0., .5, fract(rp.y / 6.));
  col += uRain * drop * .22 * mix(1., .5, uNightK);

  // 4. snow: whiten sky-facing surfaces from the 3D mask
  float sm = smoothstep(.80, .95, up) * (.75 + .25 * vnoise(ip / 12.)) * uSnow;
  vec3 snowCol = vec3(.95,.97,1.) * (.88 + .12 * luma(col)) * mix(1., .30, uNightK) * mix(vec3(1.), vec3(.75,.82,1.), uNightK);
  vec3 base = mix(col, ((sat(col, .6) - .5) * .9 + .5) * vec3(.88,.92,1.), uSnow * .6);
  col = mix(base, snowCol, sm * .85);
  // falling flakes
  vec2 fp = frag / 9. + vec2(sin(uTime * .7 + frag.y * .01) * .6, uTime * 7.);
  float flake = step(.992, hash(floor(fp))) * smoothstep(.5, .1, length(fract(fp) - .5));
  col += step(.01, uSnow) * flake * .55 * uSnow;

  // 5. smog: haze toward warm grey by day, city-glow brown by night; thicker in the distance
  vec3 haze = mix(vec3(.78,.74,.66), vec3(.26,.21,.18), uNightK);
  float k = uSmog * (.62 + .38 * far) * (.9 + .2 * fbm(ip / 900. + uTime * .01)) * mix(1., .55, uNightK);
  col = mix(sat(col, 1. - .3 * uSmog), haze, clamp(k, 0., .6));

  o = vec4(clamp(col, 0., 1.), 1.);
}`;

function sh(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);

function tex(unit, img, nearest) {
  const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
  if (!nearest) gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, nearest ? gl.NEAREST : gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, nearest ? gl.NEAREST : gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}
const load = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

// ---------------------------------------------------------------- view (pan/zoom)
let IMG = 3072, scale = 0.3, off = [0, 0];
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  ov.width = cv.width; ov.height = cv.height;
  gl.viewport(0, 0, cv.width, cv.height);
}
function home() {
  const dpr = cv.width / innerWidth;
  scale = Math.min(cv.width, cv.height) / IMG * 0.98;
  off = [(IMG - cv.width / scale) / 2, (IMG - cv.height / scale) / 2];
}
function zoomAt(cx, cy, k) {
  const dpr = cv.width / innerWidth; cx *= dpr; cy *= dpr;
  const ns = Math.min(4, Math.max(0.08, scale * k));
  off = [off[0] + cx / scale - cx / ns, off[1] + cy / scale - cy / ns]; scale = ns;
}
addEventListener('resize', () => { resize(); });
cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
cv.addEventListener('dblclick', e => zoomAt(e.clientX, e.clientY, 2));
const ptrs = new Map(); let pinch = null;
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); cv.classList.add('drag'); });
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  const dpr = cv.width / innerWidth;
  if (ptrs.size === 1) { off = [off[0] - (e.clientX - prev[0]) * dpr / scale, off[1] - (e.clientY - prev[1]) * dpr / scale]; }
  else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinch) zoomAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, d / pinch);
    pinch = d;
  }
});
const up = e => { ptrs.delete(e.pointerId); pinch = null; if (!ptrs.size) cv.classList.remove('drag'); };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
addEventListener('keydown', e => {
  const step = 120 / scale;
  if (e.key === 'ArrowLeft') off[0] -= step; if (e.key === 'ArrowRight') off[0] += step;
  if (e.key === 'ArrowUp') off[1] -= step; if (e.key === 'ArrowDown') off[1] += step;
  if (e.key === '+' || e.key === '=') zoomAt(innerWidth / 2, innerHeight / 2, 1.25);
  if (e.key === '-') zoomAt(innerWidth / 2, innerHeight / 2, 0.8);
});

// ---------------------------------------------------------------- sun position (NOAA approximation)
function sunElevation(date, lat, lon) {
  const rad = Math.PI / 180, jd = date / 86400000 + 2440587.5, n = jd - 2451545.0;
  const L = (280.46 + 0.9856474 * n) % 360, g = ((357.528 + 0.9856003 * n) % 360) * rad;
  const lambda = (L + 1.915 * Math.sin(g) + 0.02 * Math.sin(2 * g)) * rad, eps = (23.439 - 0.0000004 * n) * rad;
  const dec = Math.asin(Math.sin(eps) * Math.sin(lambda));
  const ra = Math.atan2(Math.cos(eps) * Math.sin(lambda), Math.cos(lambda));
  const gmst = (18.697374558 + 24.06570982441908 * n) % 24;
  const ha = ((gmst * 15 + lon) * rad - ra);
  return Math.asin(Math.sin(lat * rad) * Math.sin(dec) + Math.cos(lat * rad) * Math.cos(dec) * Math.cos(ha)) / rad;
}
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// ---------------------------------------------------------------- state & UI
const $ = id => document.getElementById(id);
const S = { live: true, play: false, minutes: 0, cloud: 0, rain: 0, snow: 0, pm: 10, wind: [1, 0.3], weather: null };
const fmtT = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(Math.floor(m % 60)).padStart(2, '0')}`;
function pristinaMinutesNow() {
  const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Belgrade', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date());
  return +p.find(x => x.type === 'hour').value * 60 + +p.find(x => x.type === 'minute').value;
}
function dateForMinutes(m) {
  // today's date in Pristina at local time m (offset derived from now)
  const now = new Date(), local = pristinaMinutesNow();
  return new Date(now.getTime() + (m - local) * 60000);
}
function syncUI() {
  $('t').value = Math.round(S.minutes) % 1440; $('tv').textContent = fmtT(S.minutes % 1440);
  $('cl').value = Math.round(S.cloud * 100); $('clv').textContent = Math.round(S.cloud * 100) + '%';
  $('rn').value = Math.round(S.rain * 100); $('rnv').textContent = Math.round(S.rain * 100) + '%';
  $('sn').value = Math.round(S.snow * 100); $('snv').textContent = Math.round(S.snow * 100) + '%';
  $('pm').value = Math.round(S.pm); $('pmv').textContent = Math.round(S.pm);
  $('live').classList.toggle('on', S.live); $('play').classList.toggle('on', S.play);
  $('play').textContent = S.play ? '❚❚ Pause' : '▶ Play a day';
}
for (const [id, key, k] of [['cl', 'cloud', 100], ['rn', 'rain', 100], ['sn', 'snow', 100], ['pm', 'pm', 1], ['t', 'minutes', 1]])
  $(id).addEventListener('input', e => { S[key] = +e.target.value / k; S.live = false; if (key === 'minutes') S.play = false; syncUI(); status(); });
$('live').onclick = () => { S.live = true; S.play = false; applyLive(); syncUI(); };
$('play').onclick = () => { S.play = !S.play; if (S.play) S.live = false; syncUI(); };
$('home').onclick = home;
$('hide').onclick = () => { $('panel').style.display = 'none'; $('show').style.display = 'block'; };
$('show').onclick = () => { $('panel').style.display = ''; $('show').style.display = 'none'; };

function status() {
  const elev = sunElevation(dateForMinutes(S.minutes), LAT, LON);
  const w = S.weather;
  const live = S.live && w ? `Live · ${w.temp.toFixed(0)}°C · ${w.desc}` : (S.play ? 'Playing a day' : 'Manual');
  $('status').innerHTML = `${live}<br>${fmtT(S.minutes % 1440)} Prishtinë · sun ${elev.toFixed(0)}° · PM2.5 ${Math.round(S.pm)}`;
}
const WMO = { 0: 'clear', 1: 'mostly clear', 2: 'partly cloudy', 3: 'overcast', 45: 'fog', 48: 'fog', 51: 'drizzle', 53: 'drizzle', 55: 'drizzle',
  61: 'light rain', 63: 'rain', 65: 'heavy rain', 66: 'freezing rain', 67: 'freezing rain', 71: 'light snow', 73: 'snow', 75: 'heavy snow', 77: 'snow grains',
  80: 'showers', 81: 'showers', 82: 'heavy showers', 85: 'snow showers', 86: 'snow showers', 95: 'thunderstorm', 96: 'thunderstorm', 99: 'thunderstorm' };
async function fetchLive() {
  try {
    const [f, a] = await Promise.all([
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,cloud_cover,precipitation,rain,snowfall,snow_depth,weather_code,wind_speed_10m,wind_direction_10m&timezone=auto`).then(r => r.json()),
      fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${LAT}&longitude=${LON}&current=pm2_5,european_aqi`).then(r => r.json()),
    ]);
    const c = f.current, wd = (c.wind_direction_10m || 0) * Math.PI / 180;
    S.weather = {
      temp: c.temperature_2m, desc: WMO[c.weather_code] || 'weather ' + c.weather_code,
      cloud: (c.cloud_cover || 0) / 100,
      rain: c.rain > 0 || c.precipitation > 0 ? Math.min(1, 0.35 + (c.rain || c.precipitation) / 4) : 0,
      snow: Math.max(Math.min(1, (c.snow_depth || 0) / 0.05), c.snowfall > 0 ? 0.6 : 0),
      pm: a.current?.pm2_5 ?? 10,
      wind: [Math.sin(wd) * (c.wind_speed_10m || 5) / 10, -Math.cos(wd) * (c.wind_speed_10m || 5) / 10],
    };
  } catch (e) { S.weather = null; $('status').textContent = 'Live weather unavailable — use the sliders.'; }
}
function applyLive() {
  S.minutes = pristinaMinutesNow();
  if (S.weather) Object.assign(S, { cloud: S.weather.cloud, rain: S.weather.rain, snow: S.weather.snow, pm: S.weather.pm, wind: S.weather.wind });
  status();
}

// ---------------------------------------------------------------- buildings: pick, card, wireframe
let ID = null, sel = 0, hov = 0;
const byOsm = new Map(BLD.buildings.map(b => [b.osm, b]));
function pickAt(cx, cy) {
  if (!ID) return 0;
  const dpr = cv.width / innerWidth;
  const ix = Math.floor(off[0] + cx * dpr / scale), iy = Math.floor(off[1] + cy * dpr / scale);
  if (ix < 0 || iy < 0 || ix >= IMG || iy >= IMG) return 0;
  const k = (iy * IMG + ix) * 4;
  return ID[k] + ID[k + 1] * 256;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function select(id) {
  sel = id;
  const b = id ? BLD.buildings[id - 1] : null;
  $('card').style.display = b ? 'block' : 'none';
  history.replaceState(null, '', b ? '#b=' + b.osm : location.pathname + location.search);
  if (!b) return;
  const lines = [];
  lines.push(`<h2>${esc(b.name || b.use)}</h2>`);
  if (b.addr) lines.push(`<p>${esc(b.addr)}</p>`);
  const st = b.levels ? `${esc(b.levels)} stories` : `~${b.levels_est} stories <span class="muted">(estimated)</span>`;
  lines.push(`<p>${b.start ? 'Built ' + esc(b.start) + ' · ' : ''}${st}</p>`);
  if (b.name) lines.push(`<p>${esc(b.use)}</p>`);
  lines.push(`<p>About ${Math.round(b.height * 3.28084)} ft tall (${Math.round(b.height)} m)</p>`);
  if (b.inside && b.inside.length) lines.push(`<p class="muted" style="margin-top:8px">Inside</p><ul>${b.inside.map(n => `<li>${esc(n)}</li>`).join('')}</ul>`);
  lines.push(`<div class="src">Outline, name, address, use: OpenStreetMap. Height: measured from Google 3D tiles (private prototype only). <a href="https://www.openstreetmap.org/${b.osm}" target="_blank" rel="noopener">View on OSM ↗</a></div>`);
  $('cardbody').innerHTML = lines.join('');
}
$('cardx').onclick = () => select(0);
addEventListener('keydown', e => { if (e.key === 'Escape') select(0); });

// exact camera: no perspective, heading 45°, pitch -45°, MPP metres per image pixel
const S2 = Math.SQRT1_2;
function proj(e, n, h) {
  const X = BLD.npx / 2 + (S2 * e - S2 * n) / BLD.mpp, Y = BLD.npx / 2 - (0.5 * e + 0.5 * n + S2 * h) / BLD.mpp;
  return [(X - off[0]) * scale, (Y - off[1]) * scale];   // canvas (device) px
}
function hull(pts) {
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]), cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up_ = [];
  for (const q of p) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (const q of p.reverse()) { while (up_.length >= 2 && cr(up_[up_.length - 2], up_[up_.length - 1], q) <= 0) up_.pop(); up_.push(q); }
  return new Set(lo.concat(up_).map(q => q[2]));
}
const fx = document.createElement('canvas'), fctx = fx.getContext('2d');
function boxPts(b) {
  const top = Math.max(b.roof_main ?? b.roof, b.ground + 2);
  return { base: b.fp.map(([e, n]) => proj(e, n, b.ground)), roof: b.fp.map(([e, n]) => proj(e, n, top)) };
}
function fillBox(b, alpha) {

  const { base, roof } = boxPts(b);
  if (fx.width !== ov.width || fx.height !== ov.height) { fx.width = ov.width; fx.height = ov.height; }
  fctx.clearRect(0, 0, fx.width, fx.height); fctx.fillStyle = '#fff';
  fctx.beginPath(); roof.forEach(([x, y], i) => i ? fctx.lineTo(x, y) : fctx.moveTo(x, y)); fctx.closePath(); fctx.fill();
  for (let i = 0; i < base.length - 1; i++) {
    fctx.beginPath(); fctx.moveTo(...base[i]); fctx.lineTo(...base[i + 1]); fctx.lineTo(...roof[i + 1]); fctx.lineTo(...roof[i]); fctx.closePath(); fctx.fill();
  }

}
function drawWire() {
  octx.clearRect(0, 0, ov.width, ov.height);
  const dpr = cv.width / innerWidth;
  if (hov && hov !== sel) fillBox(BLD.buildings[hov - 1], 0.10);
  if (!sel) return;
  const b = BLD.buildings[sel - 1], { base, roof } = boxPts(b);
  fillBox(b, 0.14);
  octx.lineJoin = 'miter'; octx.lineCap = 'butt';
  octx.strokeStyle = 'rgba(255,255,255,.85)';
  octx.lineWidth = 1.2 * dpr; octx.setLineDash([4 * dpr, 4 * dpr]);
  octx.beginPath(); base.forEach(([x, y], i) => i ? octx.lineTo(x, y) : octx.moveTo(x, y)); octx.stroke();
  octx.setLineDash([]); octx.lineWidth = 1.5 * dpr; octx.strokeStyle = '#fff';
  const corners = hull(b.fp.slice(0, -1).map(([e, n], i) => [e, n, i]));
  octx.beginPath();
  for (const i of corners) { octx.moveTo(...base[i]); octx.lineTo(...roof[i]); }
  octx.stroke();
  octx.lineWidth = 2 * dpr;
  octx.beginPath(); roof.forEach(([x, y], i) => i ? octx.lineTo(x, y) : octx.moveTo(x, y)); octx.closePath(); octx.stroke();

let downAt = null;
cv.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
cv.addEventListener('pointerup', e => {
  if (downAt && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) < 5) {
    const id = pickAt(e.clientX, e.clientY);
    select(id === sel ? 0 : id);
  }
  downAt = null;
});
cv.addEventListener('pointermove', e => {
  if (ptrs.size) return;
  hov = pickAt(e.clientX, e.clientY);
  cv.style.cursor = hov ? 'pointer' : 'grab';
});
cv.addEventListener('pointerleave', () => { hov = 0; });

// ---------------------------------------------------------------- loop
let last = performance.now(), t0 = last;
function frame(now) {
  const dt = (now - last) / 1000; last = now;
  if (S.play) { S.minutes = (S.minutes + dt * 48) % 1440; syncUI(); status(); }   // 24 h in 30 s
  const elev = sunElevation(dateForMinutes(S.minutes), LAT, LON);
  const nightK = smooth(4, -7, elev);
  const goldK = smooth(-5, 2, elev) * (1 - smooth(8, 18, elev));
  const smog = Math.min(1, Math.max(0, (S.pm - 12) / 160));
  gl.uniform2f(U('uRes'), cv.width, cv.height);
  gl.uniform2f(U('uOff'), off[0], off[1]);
  gl.uniform1f(U('uScale'), scale);
  gl.uniform1f(U('uImg'), IMG);
  gl.uniform1f(U('uNightK'), nightK);
  gl.uniform1f(U('uGoldK'), goldK);
  gl.uniform1f(U('uCloud'), S.cloud);
  gl.uniform1f(U('uRain'), S.rain);
  gl.uniform1f(U('uSnow'), S.snow);
  gl.uniform1f(U('uSmog'), smog);
  gl.uniform1f(U('uTime'), (now - t0) / 1000);
  gl.uniform2f(U('uWind'), S.wind[0], S.wind[1]);
  gl.uniform1f(U('uSel'), sel);
  gl.uniform1f(U('uHov'), hov);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

}

(async () => {
  resize();
  $('status').textContent = 'Loading tiles…';
  const [d, n, u, im] = await Promise.all([load(SRC.day), load(SRC.night), load(SRC.up), load(SRC.id)]);
  IMG = d.naturalWidth;
  tex(0, d); tex(1, n); tex(2, u); tex(3, im, true);
  gl.uniform1i(U('uDay'), 0); gl.uniform1i(U('uNight'), 1); gl.uniform1i(U('uUp'), 2); gl.uniform1i(U('uId'), 3);
  { const c2 = document.createElement('canvas'); c2.width = c2.height = IMG; const x2 = c2.getContext('2d', { willReadFrequently: true, colorSpace: 'srgb' });
    x2.drawImage(im, 0, 0); ID = x2.getImageData(0, 0, IMG, IMG).data; }
  const hb = location.hash.match(/b=([a-z]+\/\d+)/); if (hb && byOsm.has(hb[1])) select(byOsm.get(hb[1]).id);
  home();
  S.minutes = pristinaMinutesNow(); syncUI(); status();
  await fetchLive(); if (S.live) applyLive(); syncUI();
  setInterval(async () => { await fetchLive(); if (S.live) { applyLive(); syncUI(); } }, 10 * 60 * 1000);
  setInterval(() => { if (S.live) { S.minutes = pristinaMinutesNow(); syncUI(); status(); } }, 30000);
  requestAnimationFrame(frame);
})();
</script>
